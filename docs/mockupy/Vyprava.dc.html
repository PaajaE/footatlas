body{margin:0}
button{font-family:inherit}
.vcam{position:absolute;left:0;top:0;width:390px;height:600px;transform-origin:0 0;transition:transform .9s cubic-bezier(.65,0,.25,1)}
.vcam.vme-cam{transform:translate(-62.7px,-119px) scale(1.9)}
.vcam.vall{transform:translate(0px,0px) scale(1)}
.raz{position:absolute;width:16px;height:16px;border-radius:50%;box-sizing:border-box;border:1.6px solid #9B2C22;background:rgba(155,44,34,.12);box-shadow:inset 0 0 0 2px #F3E7CC,inset 0 0 0 2.8px #9B2C22;transform:rotate(-10deg)}
.raz::before{content:'';position:absolute;left:5px;top:5px;width:3px;height:3px;border-radius:50%;background:#9B2C22}
.hit{position:absolute;width:26px;height:26px;margin:-5px 0 0 -5px;border:none;background:transparent;border-radius:50%;cursor:pointer;padding:0}
.seal{position:absolute;width:28px;height:28px;border-radius:50%;box-sizing:border-box;border:3px solid #8E2A20;overflow:hidden;box-shadow:0 1px 0 #5A1610,0 2px 5px rgba(43,33,24,.4);background:#8E2A20}
.seal img,.next img{width:100%;height:100%;object-fit:cover;display:block}
.next{position:absolute;width:28px;height:28px;border-radius:50%;box-sizing:border-box;border:1.5px dashed #75644E;padding:2px;background:#EFE4CB}
.next img{border-radius:50%;filter:grayscale(1) sepia(.25);opacity:.75}
.next::after,.vme::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(155,44,34,.5);animation:halo 2s ease-out infinite}
@keyframes halo{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.5);opacity:0}}
.vme{position:absolute;left:129.6px;top:214.5px;width:12px;height:12px;border-radius:50%;background:#9B2C22;border:2.5px solid #FBF5E8;box-shadow:0 1px 3px rgba(43,33,24,.45);box-sizing:content-box;margin:-2.5px 0 0 -2.5px}
.sel{position:absolute;width:34px;height:34px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid #2B2118;box-sizing:border-box;pointer-events:none;animation:selin .35s cubic-bezier(.2,1.5,.4,1) both}
@keyframes selin{0%{transform:scale(1.8);opacity:0}100%{transform:scale(1);opacity:1}}
.sheetIn{animation:sheetIn .4s cubic-bezier(.2,.9,.3,1) both}
@keyframes sheetIn{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:none}}
</style>
